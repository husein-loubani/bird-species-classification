[project]
name = "bird-species"
version = "0.1.0"
description = "Few-shot and fine-tuned bird species classification on NABirds"
requires-python = ">=3.10"
dependencies = [
    "deeplake>=3.9,<4",
    "imagehash>=4.3",
    "joblib>=1.4",
    "lightning>=2.4",
    "lime>=0.2.0.1",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "open-clip-torch>=2.29",
    "optuna>=4.0",
    "pandas>=2.2",
    "pillow>=10.4",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "timm>=1.0",
    "torch>=2.5",
    "torchmetrics>=1.4",
    "torchvision>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bird_species*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
